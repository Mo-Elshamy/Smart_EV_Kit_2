# Custom parameter overrides for Stereolabs ZED 2i on Smart EV Buggy
# Optimized for Jetson Orin (HD720 @ 15 FPS with CUDA ULTRA Depth)

/**:
  ros__parameters:
    general:
      camera_model: 'zed2i'
      grab_resolution: 'HD720'      # 1280x720
      grab_frame_rate: 15           # 15 FPS
      pub_frame_rate: 15.0          # 15 FPS
      sdk_timestamp_clock: 'SYSTEM_CLOCK'

    video:
      publish_rgb: true             # Advertise RGB images for RViz and perception

    depth:
      depth_mode: 'ULTRA'           # High accuracy CUDA stereo depth (runs on GPU without TensorRT AI dependencies)
      min_depth: 0.3                # Minimum depth in meters
      max_depth: 15.0               # Maximum depth in meters
      point_cloud_freq: 15.0        # Smooth 15 Hz point cloud streaming
      point_cloud_res: 'COMPACT'    # Bandwidth-optimized point cloud
      publish_point_cloud: true     # Advertise 3D point cloud
      publish_depth_map: false      # Disabled: saves 55 MB/s uncompressed memory (dashboard uses depth_image/compressed)
      publish_depth_image: true     # Advertise colorized depth image for visual Web/RViz view

    mapping:
      mapping_enabled: false        # Activated on-demand via ROS service for high-quality 3D spatial mapping
      resolution: 0.05              # 5cm spatial resolution
      max_mapping_range: 8.0        # 8m mapping range
      fused_pointcloud_freq: 2.0    # 2 Hz fused spatial point cloud publication

    pos_tracking:
      pos_tracking_enabled: true    # Compute visual-inertial odometry (VIO)
      pos_tracking_mode: 'GEN_1'    # Force GEN_1: prevents ZED SDK 5.2 GEN_3 locked-pose/velocity drift bug
      area_memory: false            # Disable internal area memory (slam_toolbox manages global loop closure)
      imu_fusion: true              # Fuse ZED internal BMI085 IMU with visual odometry
      two_d_mode: true              # Constrain VIO to 2D ground plane (prevents pitch/roll wobble from drifting X/Y)
      fixed_z_value: 0.0
      publish_tf: false             # Set to false: robot_localization EKF manages odom -> base_link
      publish_map_tf: false         # Set to false: slam_toolbox manages map -> odom
      publish_imu_tf: false

    debug:
      use_pub_timestamps: true      # Stamp messages with ROS system time to prevent TF extrapolation timeouts
